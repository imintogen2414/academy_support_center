<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학원지원센터 — 원장님은 가르치는 일에만, 나머지는 저희가 지원합니다</title>
<meta name="description" content="행정 지원부터 강사 교육·채용, 제휴(MOU), 홍보, 학생·학부모 관리까지. 학원 운영에 필요한 모든 지원을 한곳에서.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="학원지원센터">
<meta property="og:title" content="학원지원센터 — 원장님은 가르치는 일에만, 나머지는 저희가 지원합니다">
<meta property="og:description" content="행정 지원부터 강사 교육·채용, 제휴(MOU), 홍보, 학생·학부모 관리까지. 학원 운영에 필요한 모든 지원을 한곳에서.">
<meta property="og:url" content="https://academysupportcenter.vercel.app/">
<meta property="og:image" content="https://academysupportcenter.vercel.app/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="학원지원센터 — 원장님은 가르치는 일에만, 나머지는 저희가 지원합니다">
<meta name="twitter:description" content="행정 지원부터 강사 교육·채용, 제휴(MOU), 홍보, 학생·학부모 관리까지. 학원 운영에 필요한 모든 지원을 한곳에서.">
<meta name="twitter:image" content="https://academysupportcenter.vercel.app/assets/og.png">
<meta name="theme-color" content="#070a3d">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>

<!-- 휴대폰에서만 보이는 위쪽 탭: 지원받기 ↔ 프로그램 이용하기 바로 이동 -->
<nav class="mtabs" aria-label="화면 바로가기">
  <button type="button" data-jump="support" class="on">지원받기</button>
  <button type="button" data-jump="program">프로그램 이용하기</button>
</nav>

<!-- 왼쪽: 지원받기 — 분야 고르기 → 분야 상세 → 지원 신청 → 접수 완료 -->
<aside class="support">
  <div class="top-row">
    <a href="index.html" class="logo"><span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9l8-5 8 5v10"/><path d="M9 19v-5h6v5"/></svg></span>학원지원센터</a>
    <span class="tag">지원받기</span>
  </div>
  <div id="panel"></div>
  <div class="foot">유학 제휴 파트너 <a href="https://intoabroad.com" target="_blank" rel="noopener">인투어브로드</a> · 홍보 지원 파트너 <a href="https://intomarketing.co.kr" target="_blank" rel="noopener">인투마케팅</a> · 시안 화면이며 표시된 수치는 예시예요.</div>
</aside>

<!-- 오른쪽: 프로그램 쓰기 -->
<main id="program">
  <div class="box">
    <span class="kicker">프로그램 쓰기</span>
    <h2 id="title">다시 오셨네요</h2>
    <p class="sub" id="lede">계정으로 로그인하거나, 데모 계정으로 둘러보세요.</p>

    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="login">로그인</button>
      <button role="tab" aria-selected="false" data-tab="signup">회원가입</button>
    </div>

    <form id="loginForm" onsubmit="event.preventDefault(); go('owner')">
      <div class="field"><label for="em">이메일</label><input id="em" type="email" placeholder="you@academy.kr" autocomplete="username"></div>
      <div class="field"><label for="pw">비밀번호</label><input id="pw" type="password" placeholder="••••••••" autocomplete="current-password"></div>
      <button class="btn primary wide">로그인</button>
    </form>

    <form id="signupForm" hidden onsubmit="event.preventDefault(); go(new FormData(this).get('role'))">
      <div class="field"><label>어떤 분이세요?</label>
        <div class="roles">
          <label><input type="radio" name="role" value="owner" checked><span>원장</span></label>
          <label><input type="radio" name="role" value="teacher"><span>강사</span></label>
          <label><input type="radio" name="role" value="parent"><span>학부모</span></label>
          <label><input type="radio" name="role" value="student"><span>학생</span></label>
        </div>
      </div>
      <div class="field"><label for="nm">이름</label><input id="nm" placeholder="홍길동"></div>
      <div class="field"><label for="em2">이메일</label><input id="em2" type="email" placeholder="you@academy.kr"></div>
      <div class="field"><label for="ac">학원 이름 또는 초대 코드</label><input id="ac" placeholder="예: 하늘영어학원"></div>
      <button class="btn primary wide">가입하고 시작하기</button>
    </form>

    <div class="divider">데모 계정으로 둘러보기</div>
    <div class="demo">
      <button onclick="go('owner')"><span class="av" style="background:var(--blue-600)">정</span><div><div class="t">원장 · 정수민</div><div class="d">하늘영어학원 원장</div></div><span class="go">입장 →</span></button>
      <button onclick="go('teacher')"><span class="av" style="background:#17a06b">김</span><div><div class="t">강사 · 김민지</div><div class="d">초등 A·B반 담당</div></div><span class="go">입장 →</span></button>
      <button onclick="go('parent')"><span class="av" style="background:#c98a12">김</span><div><div class="t">학부모 · 김은정</div><div class="d">이서연 어머니 · 학원 3곳</div></div><span class="go">입장 →</span></button>
      <button onclick="go('student')"><span class="av" style="background:#7c85ff">서</span><div><div class="t">학생 · 이서연</div><div class="d">초등 5학년</div></div><span class="go">입장 →</span></button>
    </div>
    <p class="note">시안 단계라 실제 계정 없이 어떤 버튼을 눌러도 입장돼요.</p>
  </div>
</main>

<script src="assets/areas.js"></script>
<script>
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const panel = document.getElementById('panel');
let applied = null; // 방금 접수한 신청 (시안이라 화면에만 보여줌)

/* ---------- 왼쪽 패널 화면들 (#area/admin, #apply, #done 같은 해시로 이동) ---------- */
function homeView() {
  return `
    <h1>원장님은 가르치는 일에만,<br><em>나머지는 저희가 지원합니다</em></h1>
    <p class="lede">필요한 지원 분야를 골라 보세요. 자세히 보고 바로 신청할 수 있어요.</p>
    <div class="label">무엇을 지원받고 싶으세요?</div>
    <div class="glist">${SITE_AREAS.map(a => `
      <a class="grow" href="#area/${a.id}"><span class="ic">${sic(a.icon)}</span><span><b>${a.name}</b><small>${a.short}</small></span><span class="go">자세히 ›</span></a>`).join('')}
    </div>
    <div class="acts"><a class="btn light" href="#apply">지원 신청하기</a></div>`;
}

// 분야 상세페이지: 소개 → 이런 고민 → 지원 내용 → 진행 과정 → 자주 묻는 질문 → 다른 분야
function areaView(a) {
  const idx = SITE_AREAS.indexOf(a) + 1;
  const second = a.link
    ? `<a class="btn outline" href="${a.link[1]}" target="_blank" rel="noopener">${a.link[0]} ${sic('ext')}</a>`
    : `<a class="btn outline" href="${a.demo}">실제 화면 미리 보기</a>`;
  return `
    <a class="back" href="#">‹ 전체 지원 분야</a>
    <div class="d-head"><div class="big-ic">${sic(a.icon)}</div><span class="kick">지원 분야 ${idx}/${SITE_AREAS.length} · ${a.name}</span></div>
    <h1>${a.title}</h1>
    <p class="lede">${a.lede}</p>

    <section class="d-sec">
      <h3>이런 고민 있으세요?</h3>
      <div class="pains">${a.pains.map(p => `<div>${p}</div>`).join('')}</div>
    </section>

    <section class="d-sec">
      <h3>이렇게 지원해요<small>${a.name}에서 받을 수 있는 지원 ${a.items.length}가지</small></h3>
      <div class="feats">${a.items.map(([t, d, list], i) => `
        <article>
          <span class="n">0${i + 1}</span>
          <b>${t}</b>
          <p>${d}</p>
          <ul>${list.map(x => `<li>${sic('check')}<span>${x}</span></li>`).join('')}</ul>
        </article>`).join('')}
      </div>
    </section>

    <section class="d-sec">
      <h3>진행 과정</h3>
      <ol class="flow">${a.steps.map(s => `<li>${s}</li>`).join('')}</ol>
    </section>

    <section class="d-sec">
      <h3>자주 묻는 질문</h3>
      <div class="faq">${a.faq.map(([q, ans]) => `<details><summary>${q}</summary><p>${ans}</p></details>`).join('')}</div>
    </section>

    <section class="d-sec">
      <h3>다른 지원 분야</h3>
      <div class="chips">${SITE_AREAS.filter(x => x !== a).map(x => `<a href="#area/${x.id}">${sic(x.icon)}${x.name}</a>`).join('')}</div>
    </section>

    <div class="sticky-cta">
      <span><b>${a.name}</b> · 신청하면 담당 매니저가 1일 안에 연락드려요</span>
      <div class="acts"><a class="btn light" href="#apply/${a.id}">이 지원 신청하기</a>${second}</div>
    </div>`;
}

function applyView(pick) {
  return `
    <a class="back" href="${pick ? `#area/${pick}` : '#'}">‹ 이전으로</a>
    <h1>지원 신청</h1>
    <p class="lede">남겨 주시면 학원지원센터 담당 매니저가 1일 안에 연락드려요.</p>
    <form class="form" id="applyForm" novalidate>
      <div class="two">
        <label class="f">학원 이름<input name="academy" placeholder="예: 하늘영어학원"></label>
        <label class="f">지역<input name="area" placeholder="예: 수원 영통구"></label>
      </div>
      <div class="two">
        <label class="f">원장님 성함<input name="name" placeholder="홍길동"></label>
        <label class="f">연락처<input name="phone" type="tel" placeholder="010-0000-0000"></label>
      </div>
      <div class="f">필요한 지원 (여러 개 고를 수 있어요)
        <div class="picks">${SITE_AREAS.map(a => `<label><input type="checkbox" name="need" value="${a.name}" ${a.id === pick ? 'checked' : ''}><span>${a.name}</span></label>`).join('')}</div>
      </div>
      <label class="f">더 하실 말씀<textarea name="memo" rows="3" placeholder="예: 겨울방학 전에 홍보를 시작하고 싶어요."></textarea></label>
      <p class="err" id="applyErr" hidden></p>
      <div class="acts"><button class="btn light">신청하기</button></div>
    </form>`;
}

function doneView() {
  const a = applied || { academy: '', needs: [] };
  return `
    <div class="done-ic">✓</div>
    <h1>신청이 접수됐어요</h1>
    <p class="lede">${a.academy ? `${esc(a.academy)} 원장님, ` : ''}담당 매니저가 1일 안에 연락드릴게요.${a.needs.length ? `<br>신청한 지원: ${a.needs.map(esc).join(' · ')}` : ''}</p>
    <div class="acts"><a class="btn light" href="#">처음으로</a><button class="btn outline" onclick="setTab('signup')">바로 회원가입하기</button></div>`;
}

function renderPanel() {
  const [view, id] = location.hash.slice(1).split('/');
  const area = SITE_AREAS.find(a => a.id === id);
  if (view === 'area' && area) panel.innerHTML = areaView(area);
  else if (view === 'apply') panel.innerHTML = applyView(area ? area.id : null);
  else if (view === 'done') panel.innerHTML = doneView();
  else panel.innerHTML = homeView();
  document.body.classList.toggle('wide', view === 'area' && !!area);
  document.querySelector('.support').scrollTop = 0;
  if (window.innerWidth <= 900 && location.hash) document.querySelector('.support').scrollIntoView();

  const form = document.getElementById('applyForm');
  if (form) form.onsubmit = e => {
    e.preventDefault();
    const fd = new FormData(form);
    const err = document.getElementById('applyErr');
    if (!fd.get('academy').trim() || !fd.get('name').trim() || !fd.get('phone').trim()) {
      err.textContent = '학원 이름, 원장님 성함, 연락처를 적어 주세요.'; err.hidden = false; return;
    }
    if (!fd.getAll('need').length) { err.textContent = '필요한 지원을 하나 이상 골라 주세요.'; err.hidden = false; return; }
    applied = { academy: fd.get('academy').trim(), needs: fd.getAll('need') };
    location.hash = 'done';
  };
}
window.addEventListener('hashchange', renderPanel);
renderPanel();

/* ---------- 오른쪽: 로그인 · 회원가입 ---------- */
const tabs = document.querySelectorAll('[data-tab]');
function setTab(t) {
  tabs.forEach(b => b.setAttribute('aria-selected', b.dataset.tab === t));
  document.getElementById('loginForm').hidden = t !== 'login';
  document.getElementById('signupForm').hidden = t !== 'signup';
  document.getElementById('title').textContent = t === 'login' ? '다시 오셨네요' : '학원지원센터 시작하기';
  document.getElementById('lede').textContent = t === 'login' ? '계정으로 로그인하거나, 데모 계정으로 둘러보세요.' : '역할을 고르면 그에 맞는 화면으로 안내해 드려요.';
  if (t === 'signup' && window.innerWidth <= 900) document.querySelector('main').scrollIntoView({ behavior: 'smooth' });
}
tabs.forEach(b => b.onclick = () => setTab(b.dataset.tab));
if (new URLSearchParams(location.search).has('signup')) setTab('signup');
function go(role) { location.href = 'app.html?role=' + role; }

/* ---------- 휴대폰 위쪽 탭 ---------- */
const jumps = document.querySelectorAll('[data-jump]');
jumps.forEach(b => b.onclick = () => {
  if (b.dataset.jump === 'program') document.getElementById('program').scrollIntoView({ behavior: 'smooth' });
  else window.scrollTo({ top: 0, behavior: 'smooth' });
});
// 지금 보고 있는 쪽 탭에 불이 들어오게
new IntersectionObserver(([e]) => {
  jumps.forEach(b => b.classList.toggle('on', (b.dataset.jump === 'program') === e.isIntersecting));
}, { rootMargin: '-50% 0px -50% 0px' }).observe(document.getElementById('program'));
</script>
</body>
</html>
