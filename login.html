<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 — 학원지원센터</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="assets/base.css">
<style>
body { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); }
@media (max-width: 860px) { body { grid-template-columns: 1fr; } .side { display: none; } }
.side { position: relative; overflow: hidden; color: #fff; padding: 40px; display: flex; flex-direction: column; justify-content: space-between;
  background: radial-gradient(70% 60% at 50% 110%, rgba(85,96,255,.65), transparent 70%), linear-gradient(180deg, var(--navy-900), var(--navy-800)); }
.side::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 38px, rgba(120,135,255,.10) 38px 40px, transparent 40px 78px); mask-image: linear-gradient(180deg, transparent, #000); -webkit-mask-image: linear-gradient(180deg, transparent, #000); }
.side > * { position: relative; }
.side h2 { font-size: 34px; line-height: 1.3; letter-spacing: -1px; margin: 0 0 12px; }
.side p { color: rgba(255,255,255,.7); margin: 0; }
.quote { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18); backdrop-filter: blur(10px); border-radius: 20px; padding: 20px; font-size: 14px; }
.quote b { display: block; margin-top: 10px; font-size: 13px; color: rgba(255,255,255,.75); font-weight: 500; }

main { display: grid; place-items: center; padding: 40px 24px; }
.box { width: min(420px, 100%); }
.box h1 { font-size: 28px; letter-spacing: -.8px; margin: 28px 0 6px; }
.box .lede { color: var(--muted); margin: 0 0 24px; font-size: 14px; }
.tabs { display: flex; background: var(--sunk); border-radius: 999px; padding: 4px; margin-bottom: 22px; }
.tabs button { flex: 1; border: 0; background: transparent; border-radius: 999px; padding: 9px; font-weight: 600; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field label { font-size: 13px; font-weight: 600; }
.field input, .field select { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--surface); }
.field input:focus, .field select:focus { border-color: var(--blue-500); outline: none; box-shadow: 0 0 0 4px var(--blue-50); }
.btn.wide { width: 100%; padding: 13px; font-size: 15px; }
.divider { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12px; margin: 22px 0 14px; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.demo { display: grid; gap: 8px; }
.demo button { display: grid; grid-template-columns: 38px 1fr auto; gap: 12px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px 14px; transition: border-color .15s; }
.demo button:hover { border-color: var(--blue-500); }
.demo .av { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; }
.demo .t { font-weight: 700; font-size: 14px; }
.demo .d { font-size: 12px; color: var(--muted); }
.demo .go { color: var(--blue-600); font-size: 13px; font-weight: 600; }
.roles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.roles label { border: 1px solid var(--line); border-radius: 12px; padding: 10px 4px; text-align: center; font-size: 13px; font-weight: 600; cursor: pointer; }
.roles input { position: absolute; opacity: 0; pointer-events: none; }
.roles input:checked + span { color: var(--blue-600); }
.roles label:has(input:checked) { border-color: var(--blue-500); background: var(--blue-50); }
.note { font-size: 12px; color: var(--muted); margin-top: 14px; text-align: center; }
</style>
</head>
<body>

<aside class="side">
  <a href="index.html" class="logo"><span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9l8-5 8 5v10"/><path d="M9 19v-5h6v5"/></svg></span>학원지원센터</a>
  <div>
    <h2>학원이 성장하는<br>플랫폼</h2>
    <p>홍보·상담, 강사 수업 피드백, 제휴 혜택까지 한곳에서.</p>
  </div>
  <div class="quote">
    "상담 들어온 학생이 어디서 멈추는지 보이니까, 체험수업 안내 문자만 바꿨는데 등록이 늘었어요."
    <b>— 시안용 예시 후기</b>
  </div>
</aside>

<main>
  <div class="box">
    <a href="index.html" class="logo" style="font-size:16px"><span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9l8-5 8 5v10"/><path d="M9 19v-5h6v5"/></svg></span>학원지원센터</a>

    <h1 id="title">다시 오셨네요</h1>
    <p class="lede" id="lede">계정으로 로그인하거나, 데모 계정으로 둘러보세요.</p>

    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="login">로그인</button>
      <button role="tab" aria-selected="false" data-tab="signup">회원가입</button>
    </div>

    <form id="loginForm" onsubmit="event.preventDefault(); go('owner')">
      <div class="field"><label for="em">이메일</label><input id="em" type="email" placeholder="you@academy.kr" autocomplete="username"></div>
      <div class="field"><label for="pw">비밀번호</label><input id="pw" type="password" placeholder="••••••••" autocomplete="current-password"></div>
      <button class="btn primary wide">로그인</button>
    </form>

    <form id="signupForm" hidden onsubmit="event.preventDefault(); go(new FormData(this).get('role'))">
      <div class="field"><label>어떤 분이세요?</label>
        <div class="roles">
          <label><input type="radio" name="role" value="owner" checked><span>원장</span></label>
          <label><input type="radio" name="role" value="teacher"><span>강사</span></label>
          <label><input type="radio" name="role" value="parent"><span>학부모</span></label>
          <label><input type="radio" name="role" value="student"><span>학생</span></label>
        </div>
      </div>
      <div class="field"><label for="nm">이름</label><input id="nm" placeholder="홍길동"></div>
      <div class="field"><label for="em2">이메일</label><input id="em2" type="email" placeholder="you@academy.kr"></div>
      <div class="field"><label for="ac">학원 이름 또는 초대 코드</label><input id="ac" placeholder="예: 하늘영어학원"></div>
      <button class="btn primary wide">가입하고 시작하기</button>
    </form>

    <div class="divider">데모 계정으로 둘러보기</div>
    <div class="demo">
      <button onclick="go('owner')"><span class="av" style="background:var(--blue-600)">정</span><div><div class="t">원장 · 정수민</div><div class="d">하늘영어학원 원장</div></div><span class="go">입장 →</span></button>
      <button onclick="go('teacher')"><span class="av" style="background:#17a06b">김</span><div><div class="t">강사 · 김민지</div><div class="d">초등 A·B반 담당</div></div><span class="go">입장 →</span></button>
      <button onclick="go('parent')"><span class="av" style="background:#c98a12">김</span><div><div class="t">학부모 · 김은정</div><div class="d">이서연 어머니 · 학원 3곳</div></div><span class="go">입장 →</span></button>
    </div>
    <p class="note">시안 단계라 실제 계정 없이 어떤 버튼을 눌러도 입장돼요.</p>
  </div>
</main>

<script>
const tabs = document.querySelectorAll('[data-tab]');
function setTab(t) {
  tabs.forEach(b => b.setAttribute('aria-selected', b.dataset.tab === t));
  document.getElementById('loginForm').hidden = t !== 'login';
  document.getElementById('signupForm').hidden = t !== 'signup';
  document.getElementById('title').textContent = t === 'login' ? '다시 오셨네요' : '학원지원센터 시작하기';
  document.getElementById('lede').textContent = t === 'login' ? '계정으로 로그인하거나, 데모 계정으로 둘러보세요.' : '역할을 고르면 그에 맞는 화면으로 안내해 드려요.';
}
tabs.forEach(b => b.onclick = () => setTab(b.dataset.tab));
if (new URLSearchParams(location.search).has('signup')) setTab('signup');
function go(role) { location.href = 'app.html?role=' + role; }
</script>
</body>
</html>
